name: oneapi
on:
    push:
        paths:
            - Dockerfiles/Dockerfile-stages
            - Dockerfiles/Dockerfile-oneapi*
            - .github/workflows/oneapi.yml
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-20.04
        steps:
        -   uses: actions/checkout@v4
        -   name: Login to DockerHub Registry
            run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
        -   name: Build the Docker image
            working-directory: Dockerfiles
            run: docker build --file Dockerfile-stages --target sdk --tag bigdft/sdk:oneapi .  
        -   name: Push the tagged Docker image
            run: |
                d=$(date +%Y-%m-%d--%H-%M-%S)
                docker tag bigdft/sdk:oneapi bigdft/sdk:oneapi-$d
                docker push bigdft/sdk:oneapi-$d
                docker push bigdft/sdk:oneapi
